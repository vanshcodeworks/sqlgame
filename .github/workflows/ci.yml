name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Typecheck server
        run: npm run build --workspace=packages/shared && npx tsc --noEmit --project server

      - name: Typecheck client
        run: npx tsc -b client

      - name: Lint client
        run: npm run lint --workspace=client

      - name: Test shared package
        run: npm test --workspace=packages/shared
